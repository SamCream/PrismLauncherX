name: Nix

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "develop"
      - "release-*"
    tags:
      - "*"
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"
      - "**.md"

      # Build files
      - "**.nix"
      - "nix/**"
      - "flake.lock"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"

      # Workflows
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      # File types
      - "**.cpp"
      - "**.h"
      - "**.java"
      - "**.ui"
      - "**.md"

      # Build files
      - "**.nix"
      - "nix/**"
      - "flake.lock"

      # Directories
      - "buildconfig/**"
      - "cmake/**"
      - "launcher/**"
      - "libraries/**"
      - "program_info/**"
      - "tests/**"

      # Files
      - "CMakeLists.txt"

      # Workflows
      - ".github/workflows/nix.yml"
  workflow_dispatch:
    inputs:
      build-type:
        description: Package configuration to validate
        type: choice
        options: [Debug, Release]
        default: Debug

permissions: {}

env:
  DEBUG: ${{ github.ref_type != 'tag' && inputs.build-type != 'Release' }}

jobs:
  build:
    name: Build (${{ matrix.system }})
    env:
      CACHIX_CACHE: ${{ vars.CACHIX_CACHE || 'prismlauncher' }}
      CACHIX_CAN_PUSH: ${{ (github.repository == 'PrismLauncher/PrismLauncher' || vars.CACHIX_CACHE != '') && secrets.CACHIX_AUTH_TOKEN != '' }}

    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            system: x86_64-linux

          - os: ubuntu-22.04-arm
            system: aarch64-linux

          - os: macos-26
            system: aarch64-darwin

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31

        # For PRs
      - name: Setup Nix Magic Cache
        if: ${{ github.event_name == 'pull_request' }}
        uses: DeterminateSystems/magic-nix-cache-action@v15
        with:
          diagnostic-endpoint: ""
          use-flakehub: false

        # For in-tree builds
      - name: Setup Cachix
        if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ env.CACHIX_CACHE }}
          authToken: ${{ env.CACHIX_CAN_PUSH == 'true' && secrets.CACHIX_AUTH_TOKEN || '' }}
          skipPush: ${{ env.CACHIX_CAN_PUSH != 'true' }}

      - name: Run Flake checks
        run: |
          nix flake check --print-build-logs --show-trace

      - name: Build debug package
        if: ${{ env.DEBUG == 'true' }}
        run: |
          nix build \
            --no-link --print-build-logs --print-out-paths \
            .#prismlauncher-debug >> "$GITHUB_STEP_SUMMARY"

      - name: Build release package
        if: ${{ env.DEBUG == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          nix build --no-link --print-build-logs --print-out-paths .#prismlauncher \
            | tee release-store-paths.txt \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Pin release in the configured writable cache
        if: ${{ env.DEBUG == 'false' && env.CACHIX_CAN_PUSH == 'true' && github.ref_type == 'tag' }}
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          SYSTEM: ${{ matrix.system }}
        run: |
          set -euo pipefail
          xargs cachix pin "$CACHIX_CACHE" "$TAG-$SYSTEM" < release-store-paths.txt
