name: Check source formatting
description: Run the C++ and Markdown checks used by the Nix flake before building packages
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: '3.14'
    - uses: actions/setup-node@v6
      with:
        node-version: '24'
    - name: Install the formatter pinned by the Nix flake
      shell: bash
      run: python -m pip install clang-format==22.1.8
    - name: Check C++ formatting
      shell: bash
      run: |
        shopt -s nullglob
        clang-format --dry-run --style=file --Werror */**.{c,cc,cpp,h,hh,hpp}
    - name: Check Markdown
      shell: bash
      run: npm exec --yes --package=markdownlint-cli@0.49.1 -- markdownlint --dot .
